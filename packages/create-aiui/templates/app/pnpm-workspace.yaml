# pnpm blocks dependency build scripts by default; esbuild (pulled in by Vite
# and Vitest) runs a postinstall to link its native binary, so allow it — or the
# first `pnpm install` exits nonzero with ERR_PNPM_IGNORED_BUILDS.
#
# Both spellings on purpose: `allowBuilds` is pnpm 11's name for the setting,
# `onlyBuiltDependencies` is pnpm 10's; each version reads its own key and
# ignores the other. (Inert under npm/yarn.)
allowBuilds:
  esbuild: true
onlyBuiltDependencies:
  - esbuild

# vite-plugin-solid floats babel-preset-solid across every Solid 2.0 beta, but
# the JSX compiler must match the @solidjs/web runtime beta pinned in
# package.json — newer presets emit helpers (claimElement) the beta.15 runtime
# doesn't export, so a fresh install breaks in dev and at `vite build`. Bump
# this in step with the solid-js / @solidjs/web pins.
overrides:
  babel-preset-solid: 2.0.0-beta.15
