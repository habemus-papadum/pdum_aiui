# This repository is a pnpm workspace. This file exists for ship, which releases the
# packages: one version per package, the tag is the truth, the manifest carries
# <last release>+dev between releases. See README.md "Releasing".
[project]
name = "pdum-aiui-tooling"
version = "0"
requires-python = ">=3.12"

[tool.uv]
package = false

[dependency-groups]
dev = ["habemus-papadum-ship>=0.7"]

[tool.ship]
ours = ["@habemus-papadum/*", "habemus-papadum-*"]
shared-paths = [".github/workflows/**", "pnpm-workspace.yaml"]
# The old lockstep pipeline left one commit after each release.
ignore-subjects = ["back to dev"]
# The packages consume each other from source, so a release runs the whole
# workspace's unit suites (about half a minute), not only the released package's.
test = ["pnpm run test"]
