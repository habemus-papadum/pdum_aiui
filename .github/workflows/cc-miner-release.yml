# Release cc-miner — the desktop app, NOT the npm packages.
#
# Deliberately separate from release.yml, and separate in three ways that all
# matter:
#
#   different artifacts   dmg + zip + AppImage + deb, not npm tarballs
#   different cadence     a desktop app ships when it is worth shipping, which
#                         is not when a library's version changes
#   different repo        releases go to habemus-papadum/cc-miner, because
#                         release.yml already owns the GitHub Releases list HERE
#                         (vX.Y.Z, carrying the .vsix and the extension zip) and
#                         electron-updater asks GitHub for the LATEST release
#                         before reading latest-mac.yml out of it. Two feeds in
#                         one release list means the first npm release after a
#                         cc-miner one breaks every installed app's update
#                         check. cc-miner is staged for eviction to its own repo
#                         anyway, so its releases start there.
#
# The workspace version (X.Y.Z+dev) is NOT used: semver ignores build metadata,
# so it compares equal to X.Y.Z and no updater would ever fire. The version is
# an input, and electron/pack.mjs stamps it via extraMetadata without touching
# the tree.
name: cc-miner release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for this release, e.g. 0.1.0 (no leading v)"
        required: true
      dry_run:
        description: "Build the artifacts but do NOT publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # arm64 runner
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    # Lifted to the job so a step `if` can test it: the `secrets` context is NOT
    # available in a step-level `if`, but `env` is.
    env:
      APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # The Apple credentials electron-builder reads are a PATH to the .p8, not
      # its contents, so the secret is materialised first. Written outside the
      # workspace so no `files` glob can ever sweep a signing key into a bundle.
      - name: Materialise the App Store Connect key
        if: matrix.target == 'mac' && env.APPLE_API_KEY_B64 != ''
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.target }}
        env:
          PDUM_CC_MINER_VERSION: ${{ inputs.version }}
          # Opt-in, and only when this is not a dry run. electron-builder would
          # otherwise publish on its own the moment it detects CI.
          PDUM_CC_MINER_PUBLISH: ${{ inputs.dry_run && 'never' || 'always' }}
          # Publishing to ANOTHER repo, so the automatic GITHUB_TOKEN is not
          # enough — it is scoped to this one. A PAT with `contents: write` on
          # habemus-papadum/cc-miner.
          GH_TOKEN: ${{ secrets.PDUM_CC_MINER_RELEASE_TOKEN }}
          # Signing (macOS). Absent → pack.mjs reports "unsigned" and carries on,
          # which is the right behaviour for a dry run and a loud one for a real
          # release.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm -C apps/cc-miner run pack:${{ matrix.target }}

      # Kept regardless of publishing, so a dry run still produces something
      # inspectable — and so a failed publish does not also lose the build.
      - uses: actions/upload-artifact@v4
        with:
          name: cc-miner-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/cc-miner/release/*.dmg
            apps/cc-miner/release/*.zip
            apps/cc-miner/release/*.AppImage
            apps/cc-miner/release/*.deb
            apps/cc-miner/release/*.yml
