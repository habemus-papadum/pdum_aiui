name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Browser ownership, filesystem locks and exec semantics must work on both OSes.
  # The lifecycle suite uses isolated browser-shaped processes, with no agent login.
  aibr:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C packages/aibr build
      - run: pnpm -C packages/aibr typecheck
      - run: pnpm -C packages/aibr test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # ship reads each package's release tags

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install (frozen lockfile — also the lockfile-drift guard)
        run: pnpm install --frozen-lockfile

      - name: Install ship
        run: uv sync --locked

      - name: Release policy (versions, tags, peer ranges, lockfiles, skill copies)
        run: uv run ship deps check

      - name: Plugin manifests parse & skill markdown links resolve
        run: node scripts/check-skill-links.mjs

      - name: Build all packages
        run: pnpm -r run build

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Lint & format check (Biome)
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Install Chromium for offline browser tests
        run: pnpm -C packages/aiui-audio exec playwright install --with-deps chromium

      - name: Browser audio, STT, screen capture, and pencil (no vendor credentials)
        run: |
          pnpm -C packages/aiui-audio test:browser
          pnpm -C packages/aiui-stt test:browser
          pnpm -C packages/aiui-screen-capture test:browser
          pnpm -C packages/aiui-pencil test:browser

  # Consumability gate: build → pack every publishable package → install the
  # tarballs into a scratch npm project → probe the installed packages the way
  # a consumer would. Catches missing `files` entries (a package shipping
  # without its built assets), subpaths that only resolve in the workspace
  # layout, and workspace: ranges that don't convert. No browser. Locally:
  # `pnpm test:packaging`.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Packaging test (pack → scratch install → installed-shape probes)
        run: pnpm run test:packaging

  # Starter-template gate: the template's example tests never execute under any
  # package's own vitest project (they need the template's vitest config, which
  # only exists once scaffolded). This job scaffolds a throwaway in-repo demo
  # via the real `pnpm new-demo` path, proves the sceneried app's tests pass,
  # applies the mechanical reset EXACTLY as the template CLAUDE.md documents it
  # (guarding the <aiui-scenery> fence grammar), and proves the blank app
  # typechecks, tests green, and production-builds. Locally: `pnpm test:template`.
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Template e2e (scaffold → test → mechanical reset → blank verify)
        run: pnpm run test:template
