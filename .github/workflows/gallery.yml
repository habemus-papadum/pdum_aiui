# Publish the demos/gallery static site to S3 and invalidate CloudFront on every
# push to main that can change it (the demos, the packages they build from, the
# lockfile), or by hand. It used to ride the release workflow; ship releases one
# package per run, so the site deploys from main instead.
#
# The job talks to AWS over OIDC, with NO stored secret. Its id-token lets
# aws-actions/configure-aws-credentials assume the IAM role
# `pdum-aiui-gallery-publish`, whose trust policy allows only this repository on
# refs/heads/main (sub claim) and whose permission policy is least-privilege:
# write under s3://habemus-papadum.net/aiui/* and CreateInvalidation on one
# distribution — nothing else. The role ARN is not a secret (it is only
# assumable via the OIDC trust above), so it lives here in plaintext.
# Provisioned out-of-band in AWS account 789030644255; the resources and the
# recreate commands are recorded in demos/gallery/PUBLISHING.md.
name: gallery

on:
  push:
    branches: [main]
    paths:
      - "demos/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/gallery.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: gallery-publish
  cancel-in-progress: false

jobs:
  publish-site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: assume the AWS publish role — no stored secret
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Source-first: the gallery builds from linked workspace source, so a plain
      # install is all the prep the vite build needs.
      - run: pnpm install --frozen-lockfile

      - name: Assume the AWS publish role (GitHub OIDC — no secret)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::789030644255:role/pdum-aiui-gallery-publish
          aws-region: us-east-1

      - name: Build demos/gallery and publish to S3 + invalidate CloudFront
        env:
          PUBLISH: "1" # real upload, not the script's default dry run
          CF_ID: E2OPILUJ3WDTIB # skip ListDistributions (role isn't allowed it)
        run: bash demos/gallery/publish.sh --publish
