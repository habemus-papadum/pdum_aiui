# The only publish path. ship releases one package per run: it computes the version
# from the package's last tag, builds the package and its workspace dependencies,
# runs the tests, publishes to npm, tags <package>-v<version>, pushes, creates the
# GitHub release and returns the manifest to <version>+dev. The gallery deploys on
# push to main (gallery.yml), not here. Run from the Actions UI or:
#   gh workflow run release.yml -f package=@habemus-papadum/aiui-viz -f bump=minor -f dry_run=false
name: release
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release (npm packages by their scoped name)
        type: string
        required: true
      bump:
        description: patch, minor or major, applied to the last release tag
        type: choice
        options: [patch, minor, major]
        default: minor
      dry_run:
        description: Plan and print; write nothing
        type: boolean
        default: true
      skip_ci_check:
        description: Release without waiting for the CI workflow
        type: boolean
        default: false
      skip_tests:
        description: Do not run the test commands before publishing
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  release:
    uses: habemus-papadum/pdum_ship/.github/workflows/release.yml@main
    with:
      package: ${{ inputs.package }}
      bump: ${{ inputs.bump }}
      dry_run: ${{ inputs.dry_run }}
      skip_ci_check: ${{ inputs.skip_ci_check }}
      skip_tests: ${{ inputs.skip_tests }}
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      contents: write
      actions: read
      id-token: write   # npm provenance attestations
