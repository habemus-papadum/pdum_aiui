# CI for the evicted repo. Generated by scripts/evict.mjs — edit the template at
# scripts/_evicted/.github/workflows/ci.yml in pdum_aiui, not the copy, until
# this repo stops being re-generated.
#
# Two jobs, and the split is the point. `gates` is the fast feedback everyone
# waits on; `smoke` is slow (it downloads Electron and packages ~500 MB) and
# answers a different question — not "does it compile" but "does the shipped
# artifact boot".
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Packages the real bundle and drives it over CDP. This is the job that would
  # have caught a native binding that failed to unpack, a dylib that cannot be
  # dlopen'd, or an asset the custom scheme serves with the wrong MIME type —
  # none of which any amount of `tsc` or `vitest` can see.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Package (unpackaged dir — no dmg/AppImage needed to boot it)
        run: pnpm -C pdum-cc-miner run pack:dir

      # A GitHub runner has no display, and Electron's setuid sandbox helper is
      # not privileged in the unpacked build — hence xvfb and --no-sandbox.
      # Neither weakens what is being tested: the renderer's own `sandbox: true`
      # is unaffected, and the failures this job exists to catch are in the main
      # process and the sidecar.
      - name: Smoke (Linux)
        if: runner.os == 'Linux'
        env:
          PDUM_CC_MINER_SMOKE_ARGS: "--no-sandbox"
        run: xvfb-run -a pnpm -C pdum-cc-miner run smoke

      - name: Smoke (macOS)
        if: runner.os == 'macOS'
        run: pnpm -C pdum-cc-miner run smoke
