packages:
  - "packages/*"
  # In-repo demo apps (`pnpm new-demo <name>`): never published, but full workspace
  # members so their `@habemus-papadum/*` deps resolve to source via `workspace:^`.
  # Note this also enrolls them in version lockstep — scripts/versioning.mjs reads
  # the globs in this list, so every demo carries the shared version.
  - "demos/*"
  # Standalone apps, staged for eviction to their own repo. They are full
  # workspace members TODAY — `workspace:^` source-first editing, CI typecheck,
  # version lockstep — and `scripts/evict.mjs` rewrites a copy to consume
  # `@habemus-papadum/*` from npm instead. Living here rather than in demos/
  # says they are products, not illustrations: nothing discovers them, nothing
  # composes them, and their dependency on this repo is meant to become a
  # published version range. See CLAUDE.md → "The apps/ directory".
  - "apps/*"

# The ONE npm-pinned in-repo package (bootstrap/aiui-registry — outside the
# workspace, published manually; see CLAUDE.md → "The bootstrap/ directory").
# A catalog entry so every workspace consumer resolves the SAME version: its
# on-disk formats are a cross-process protocol, and two compiled-in versions
# could disagree. Bump it here, once, after publishing a new registry version.
catalog:
  "@habemus-papadum/aiui-registry": 0.1.0
  # Shared singleton versions: deps declared by 3+ workspace members, where
  # "everyone on the same version" is the point. Each bumps independently —
  # unlike the `solid` group below, these carry no moves-together claim.
  # Manifests reference them as `"catalog:"`. (aiui-intent-client's jsdom
  # deliberately stays a literal ^25 pin — unify it when its tests can gate
  # the jump.)
  "@babel/core": ^7.29.7
  "@duckdb/duckdb-wasm": 1.33.1-dev61.0 # exact; keep in step with the override below
  "@observablehq/plot": ^0.6.17
  "@types/express": ^5.0.0
  "@types/ws": ^8.5.0
  commander: ^15.0.0
  express: ^5.1.0
  jsdom: ^29.0.0
  tsx: ^4.22.5
  typescript: ^5.6.0
  typescript-language-server: ^5.3.0
  vite: ^6.4.3
  vitest: ^3.2.0
  ws: ^8.18.0

# Named catalogs: each group is a set of versions that move together. Manifests
# reference them as `"catalog:<name>"`; `pnpm pack`/`publish` materialize the
# literal version, so published artifacts are unchanged (pnpm test:packaging
# guards this). NOT used by create-aiui's app template — its package.json ships
# as an asset that npm/yarn must also be able to parse, so it keeps literal
# pins; bump it in step with the catalog (new-demo rewrites scaffolded demos to
# catalog references, so only the template itself carries literals).
catalogs:
  # The Solid 2.0 beta line. During the beta the JSX compiler and runtime move
  # in lockstep (see the babel-preset-solid override below); bumping Solid is
  # editing these three lines plus the two overrides below and the template.
  solid:
    solid-js: 2.0.0-beta.32
    "@solidjs/web": 2.0.0-beta.32
    vite-plugin-solid: 3.0.0-next.24

# Mosaic pins an exact, older duckdb-wasm (`@uwdata/mosaic-core@0.28.1` wants
# 1.33.1-dev45.0). Without this override two copies install, and passing our
# connection into `wasmConnector()` fails to typecheck against the other copy's
# `AsyncDuckDBConnection` — same shape, different declaration. Collapsing to one
# copy is what makes the types unify; keep this in step with the default
# catalog's @duckdb/duckdb-wasm entry above (which is what the consumers —
# aiui-viz, demos/seismos, apps/cc-miner — declare via `catalog:`).
overrides:
  "@duckdb/duckdb-wasm": 1.33.1-dev61.0
  # vite-plugin-solid@next floats babel-preset-solid across every 2.0 beta, but
  # the JSX compiler must match the @solidjs/web runtime beta — newer presets
  # emit helpers (claimElement, scope) that older runtimes don't export,
  # breaking consumers at dev/build time. This makes the invariant explicit and
  # keeps `pnpm update` honest. Bump in step with the `solid` catalog above
  # (see frontend-hard-won.md, "Ecosystem status").
  babel-preset-solid: 2.0.0-beta.32
  # Same trap, one layer down: solid-js depends on @solidjs/signals via a caret
  # that floats across betas (`^2.0.0-beta.N` matches every later beta), so a
  # fresh lockfile can pair an old solid-js with a newer signals core. Pin it to
  # the same beta as the `solid` catalog and bump them together.
  "@solidjs/signals": 2.0.0-beta.32

# pnpm blocks dependency build scripts by default; allow the ones we trust.
# (esbuild ships a prebuilt binary but runs a postinstall to link it.)
allowBuilds:
  # @vscode/vsce (aiui-vscode's .vsix packager) drags these two in; neither
  # build script matters for `vsce package` — keytar's native build backs the
  # legacy credential store, vsce-sign's postinstall fetches its marketplace
  # signing binary — so both are explicitly denied, not trusted.
  "@vscode/vsce-sign": false
  # cc-miner's second host (`pnpm dev:electron`). NOT optional and NOT cosmetic:
  # pnpm 11 refuses to finish `pnpm install` while the decision is unmade
  # (ERR_PNPM_IGNORED_BUILDS), and every script here runs a deps check first — so
  # an undecided `electron` breaks the whole repo, including `pnpm dev` for apps
  # that have nothing to do with Electron. Before you "correct" this: electron@43
  # publishes NO `scripts` field at all (the ~200 MB binary is fetched lazily by
  # index.js on the first `require("electron")`), and pnpm asks anyway. `true`
  # buys no install-time download; it settles a question pnpm insists on.
  electron: true
  # Reached only through electron-builder, and only on the Windows path — its
  # install script fetches the Squirrel.Windows binaries. cc-miner ships macOS
  # (dmg + zip) and Linux (AppImage + deb) and no Windows target, so the
  # download is pure cost. Denied rather than left undecided: pnpm 11 refuses to
  # finish `pnpm install` while the question is open, which breaks every script
  # in the repo (see the `electron` note above for the same trap).
  electron-winstaller: false
  esbuild: true
  keytar: false

minimumReleaseAgeExclude:
  # The cf_browser_credentials kit (aiui-cf-creds' substrate) is our own —
  # freshly published versions are consumed deliberately, pinned per version.
  - '@habemus-papadum/cf-browser-credentials@0.2.2'
  - '@habemus-papadum/cf-creds-aws@0.2.2'
  - '@habemus-papadum/cf-creds-elevenlabs@0.2.2'
  - '@habemus-papadum/cf-creds-mosaic@0.2.2'
  - '@habemus-papadum/cf-creds-openai@0.2.2'
  - '@habemus-papadum/aiui-registry-host-darwin-arm64@0.1.0'
  - '@habemus-papadum/aiui-registry-host-darwin-x64@0.1.0'
  - '@habemus-papadum/aiui-registry-host-linux-arm64@0.1.0'
  - '@habemus-papadum/aiui-registry-host-linux-x64@0.1.0'
  - '@habemus-papadum/aiui-registry@0.1.0'
  - vite-plugin-solid@3.0.0-next.24
